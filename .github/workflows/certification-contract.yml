name: customer-certification-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Current Framework substantive source baseline after PR #105. It owns the durable
  # Fabric Pipeline child plus one-call runtime/first-time Control Plane bootstrap.
  # This is a source/CI compatibility lane only; Customer production remains pinned
  # to immutable v0.3.0 until Framework v0.4.0 is actually released and approved.
  CERTIFICATION_FRAMEWORK_SHA: cb9f9be77a98a0a5aa8c5f85e0fa3d92697c60f0

jobs:
  certification-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Customer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout exact certification framework source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ruizengalways/fabric-data-framework
          ref: ${{ env.CERTIFICATION_FRAMEWORK_SHA }}
          path: framework-certification

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install exact certification framework source
        run: |
          python -m pip install ./framework-certification
          python -m pip install "setuptools>=77"
          python -m pip check

      - name: Build bounded certification extension wheel
        run: |
          mkdir -p build/certification-dist
          python -m pip wheel certification/extensions \
            --no-deps --no-build-isolation \
            -w build/certification-dist
          test -f build/certification-dist/fabric_customer_certification_extensions-0.4.0.dev0-py3-none-any.whl

      - name: Build verified Fabric binding fixture
        run: |
          cat > build/fabric-bindings.json <<'JSON'
          {
            "schema_version": 1,
            "verification_status": "VERIFIED",
            "environment": "DEV",
            "workspace_id": "00000000-0000-0000-0000-000000000001",
            "deployment_result_sha256": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
            "notebook": {
              "id": "00000000-0000-0000-0000-000000000010",
              "type": "Notebook",
              "display_name": "framework-certification-worker"
            },
            "item_read": {
              "id": "00000000-0000-0000-0000-000000000011",
              "type": "Lakehouse",
              "display_name": "certification-lakehouse"
            },
            "pipeline": {
              "id": "00000000-0000-0000-0000-000000000012",
              "type": "DataPipeline",
              "display_name": "framework-certification-child"
            },
            "copy_job": {
              "id": "00000000-0000-0000-0000-000000000013",
              "type": "CopyJob",
              "display_name": "framework-certification-copy"
            },
            "spark_job": {
              "id": "00000000-0000-0000-0000-000000000014",
              "type": "SparkJobDefinition",
              "display_name": "framework-certification-spark"
            },
            "contains_secret_values": false,
            "certification_result": "NOT_RUN"
          }
          JSON

      - name: Validate typed certification input bundle from verified bindings
        run: |
          python certification/build_candidate_inputs.py \
            --extension-wheel build/certification-dist/fabric_customer_certification_extensions-0.4.0.dev0-py3-none-any.whl \
            --output build/certification-inputs \
            --customer-git-sha "${GITHUB_SHA}" \
            --candidate-git-sha 1111111111111111111111111111111111111111 \
            --candidate-wheel-sha256 2222222222222222222222222222222222222222222222222222222222222222 \
            --framework-version 0.4.0 \
            --environment DEV \
            --fabric-bindings build/fabric-bindings.json \
            --control-plane-profile fabric_sql_database_v1

      - name: Validate backwards-compatible explicit binding path
        run: |
          python certification/build_candidate_inputs.py \
            --extension-wheel build/certification-dist/fabric_customer_certification_extensions-0.4.0.dev0-py3-none-any.whl \
            --output build/certification-inputs-explicit \
            --customer-git-sha "${GITHUB_SHA}" \
            --candidate-git-sha 1111111111111111111111111111111111111111 \
            --candidate-wheel-sha256 2222222222222222222222222222222222222222222222222222222222222222 \
            --framework-version 0.4.0 \
            --environment DEV \
            --workspace-id 00000000-0000-0000-0000-000000000001 \
            --item-read-id 00000000-0000-0000-0000-000000000011 \
            --pipeline-item-id 00000000-0000-0000-0000-000000000012 \
            --copy-job-id 00000000-0000-0000-0000-000000000013 \
            --spark-job-id 00000000-0000-0000-0000-000000000014 \
            --control-plane-profile fabric_sql_database_v1

      - name: Assert fail-closed live boundary and exact physical binding provenance
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          value = json.loads(Path("build/certification-inputs/INPUTS.json").read_text())
          explicit = json.loads(Path("build/certification-inputs-explicit/INPUTS.json").read_text())
          assert value["candidate_git_sha"] == "1" * 40
          assert value["candidate_wheel_sha256"] == "2" * 64
          assert value["physical_binding_source"] == "verified_fabric_bindings"
          expected_binding_hash = hashlib.sha256(Path("build/fabric-bindings.json").read_bytes()).hexdigest()
          assert value["fabric_bindings_sha256"] == expected_binding_hash
          assert explicit["physical_binding_source"] == "explicit_cli"
          assert explicit["fabric_bindings_sha256"] is None
          assert explicit["domain_release_hash"] == value["domain_release_hash"]
          assert value["live_prerequisites_configured"] is False
          assert value["live_prerequisite_blockers"] == [
              "control_plane_external_evidence_incomplete",
              "warehouse_real_fault_controller_not_configured",
          ]
          assert Path("build/certification-inputs/fabric-bindings.json").read_bytes() == Path("build/fabric-bindings.json").read_bytes()
          assert not Path("build/certification-inputs-explicit/fabric-bindings.json").exists()
          assert Path("build/certification-inputs/release-manifest.json").is_file()
          assert Path("build/certification-inputs/runner-config.json").is_file()
          assert Path("build/certification-inputs/project/config/datasets/cert.full_replace.json").is_file()
          assert Path("build/certification-inputs/project/config/certification/pipeline-worker.json").is_file()
          PY
