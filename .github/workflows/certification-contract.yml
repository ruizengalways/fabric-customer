name: customer-certification-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Current Framework substantive source baseline after PR #107. It owns the durable
  # Fabric Pipeline child, one-call runtime/Control Plane bootstrap, fail-at-end parent
  # aggregation, execution-group policy, DQ/quarantine budgets and conservative recovery
  # planning. This is a source/CI compatibility lane only; Customer production remains
  # pinned to immutable v0.3.0 until Framework v0.4.0 is released and approved.
  CERTIFICATION_FRAMEWORK_SHA: 4c8ad9994f3800e901c146b919f85454d78f080e

jobs:
  certification-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Customer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout exact certification framework source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ruizengalways/fabric-data-framework
          ref: ${{ env.CERTIFICATION_FRAMEWORK_SHA }}
          path: framework-certification

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install exact certification framework source
        run: |
          python -m pip install ./framework-certification
          python -m pip install "setuptools>=77"
          python -m pip check

      - name: Validate Framework 0.4 pipeline operations examples
        run: |
          python - <<'PY'
          from pathlib import Path

          from fabric_data_framework.deployment.delivery import (
              config_bundle_hash,
              load_dataset_configs,
              load_execution_group_policies,
          )

          root = Path("examples/pipeline_development/framework_0_4/execution-groups")
          policies = load_execution_group_policies(root)
          assert {item.execution_group for item in policies} == {
              "health_full_refresh",
              "health_scd2",
              "health_scd1",
              "health_debezium",
          }
          assert all(item.failure_policy.value == "FAIL_AT_END" for item in policies)
          assert all(item.policy_hash for item in policies)

          datasets = load_dataset_configs("config/datasets")
          dataset_only_hash = config_bundle_hash(datasets)
          with_group_policy_hash = config_bundle_hash(datasets, policies)
          assert dataset_only_hash != with_group_policy_hash
          PY

      - name: Build bounded certification extension wheel
        run: |
          mkdir -p build/certification-dist
          python -m pip wheel certification/extensions \
            --no-deps --no-build-isolation \
            -w build/certification-dist
          test -f build/certification-dist/fabric_customer_certification_extensions-0.4.0.dev0-py3-none-any.whl

      - name: Validate typed certification input bundle
        run: |
          python certification/build_candidate_inputs.py \
            --extension-wheel build/certification-dist/fabric_customer_certification_extensions-0.4.0.dev0-py3-none-any.whl \
            --output build/certification-inputs \
            --customer-git-sha "${GITHUB_SHA}" \
            --candidate-git-sha 1111111111111111111111111111111111111111 \
            --candidate-wheel-sha256 2222222222222222222222222222222222222222222222222222222222222222 \
            --framework-version 0.4.0 \
            --environment DEV \
            --workspace-id 00000000-0000-0000-0000-000000000001 \
            --item-read-id 00000000-0000-0000-0000-000000000011 \
            --pipeline-item-id 00000000-0000-0000-0000-000000000012 \
            --copy-job-id 00000000-0000-0000-0000-000000000013 \
            --spark-job-id 00000000-0000-0000-0000-000000000014 \
            --control-plane-profile fabric_sql_database_v1

      - name: Assert fail-closed live boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path("build/certification-inputs/INPUTS.json").read_text())
          assert value["candidate_git_sha"] == "1" * 40
          assert value["candidate_wheel_sha256"] == "2" * 64
          assert value["live_prerequisites_configured"] is False
          assert value["live_prerequisite_blockers"] == [
              "control_plane_external_evidence_incomplete",
              "warehouse_real_fault_controller_not_configured",
          ]
          assert Path("build/certification-inputs/release-manifest.json").is_file()
          assert Path("build/certification-inputs/runner-config.json").is_file()
          assert Path("build/certification-inputs/project/config/datasets/cert.full_replace.json").is_file()
          assert Path("build/certification-inputs/project/config/certification/pipeline-worker.json").is_file()
          PY
