name: customer-simulator-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Validate tag and simulator independently
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          python -m pip install -e '.[dev]'
          pytest -q
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("fabric_data_framework") is None
          PY
      - name: Build immutable simulator wheel
        run: |
          python -m pip install build
          python -m build --wheel
          (cd dist && sha256sum *.whl | tee SHA256SUMS)
      - name: Refuse release overwrite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then exit 1; fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --title "fabric-customer ${GITHUB_REF_NAME}" --generate-notes
