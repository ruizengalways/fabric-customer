name: customer-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FRAMEWORK_REPO_TOKEN: ${{ secrets.FRAMEWORK_REPO_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require private framework read token
        run: |
          if [ -z "${FRAMEWORK_REPO_TOKEN}" ]; then
            echo "FRAMEWORK_REPO_TOKEN must grant read access to the private framework release." >&2
            exit 1
          fi
      - name: Checkout Customer immutable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Validate Customer tag
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          python scripts/validate_metadata.py
      - name: Download exact released framework wheel
        env:
          GH_TOKEN: ${{ secrets.FRAMEWORK_REPO_TOKEN }}
        run: |
          mkdir framework-dist
          gh release download v0.3.0 \
            --repo ruizengalways/fabric-data-framework \
            --pattern 'fabric_data_framework-0.3.0-*.whl' \
            --dir framework-dist
      - name: Install release dependency and test
        run: |
          python -m pip install framework-dist/*.whl
          python -m pip install -e ".[dev]"
          pytest -q
          python -m pip check
      - name: Build Customer wheel and immutable manifest
        run: |
          rm -rf dist
          python -m pip wheel . --no-deps --no-build-isolation -w dist
          fabric-framework release-manifest \
            --domain customer \
            --domain-release-version "${GITHUB_REF_NAME#v}" \
            --domain-git-sha "${GITHUB_SHA}" \
            --framework-version 0.3.0 \
            --config-dir config/datasets \
            --build-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --artifact "customer-wheel=$(echo dist/*.whl)" \
            --output dist/release-manifest.json
          sha256sum dist/*.whl dist/release-manifest.json | tee dist/SHA256SUMS
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; immutable release overwrite refused." >&2
            exit 1
          fi
      - name: Create Customer GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --title "fabric-customer ${GITHUB_REF_NAME}" \
            --generate-notes
