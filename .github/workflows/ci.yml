name: customer-simulator-ci

on:
  pull_request:
  push:
    branches: [main, "refactor/**", "docs/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install simulator only
        run: python -m pip install -e ".[dev]"
      - name: Assert framework is not installed as a dependency
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("fabric_data_framework") is None
          PY
      - name: Unit and architecture tests
        run: pytest -q
      - name: Lint
        run: ruff check src tests
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip check
      - name: Deterministic workload materialization and verification
        run: |
          rm -rf build/customer-scenario
          fabric-customer materialize --through-day 7 --output build/customer-scenario
          fabric-customer verify --output build/customer-scenario
          test -f build/customer-scenario/expected/current_state/day_07/customers.json
          test -f build/customer-scenario/SHA256SUMS
          test -f build/customer-scenario/WORKLOAD.json
